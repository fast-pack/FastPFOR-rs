name: PR comments

# Posts the reports of CI jobs as sticky PR comments. Those jobs run the pull request's code with a
# read-only token (always so for pull requests from forks), so they only upload each report, with the
# PR number, as an artifact. This workflow runs from the default branch with a write token, and never
# checks out or runs pull request code: it only downloads the reports and posts them.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions: {}

jobs:
  comment:
    name: Post ${{ matrix.artifact }}
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Copy/paste detection (`cpd` job)
          - { artifact: jscpd, skip_unchanged: true }
          # Instruction counts (`bench` job)
          - { artifact: instruction-counts, skip_unchanged: false }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # The CI run may have no report, e.g. when it failed before the job finished.
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the report belongs to its pull request
        id: pr
        if: hashFiles('report/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(cat report/pr-number)"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in the report: $pr"
            exit 1
          fi
          # The artifact comes from pull request code, so only trust its PR number if that PR's head is
          # the commit the CI run tested. This keeps one PR from commenting on another.
          pr_head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::warning::PR #$pr is now at $pr_head, not the tested $HEAD_SHA; not commenting."
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.artifact }}
          number_force: ${{ steps.pr.outputs.number }}
          path: report/summary.md
          skip_unchanged: ${{ matrix.skip_unchanged }}
