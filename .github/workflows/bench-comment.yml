name: Benchmark comment

# Posts the instruction counts of the CI `bench` job as a sticky PR comment. The CI job runs the pull
# request's code with a read-only token (always so for pull requests from forks), so it only uploads
# the report. This workflow runs from the default branch with a write token, and never checks out or
# runs pull request code: it only downloads the report and posts it.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions: {}

jobs:
  comment:
    name: Post instruction counts
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # The CI run may have no report, e.g. when it failed before the `bench` job finished.
        continue-on-error: true
        with:
          name: instruction-counts
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the report belongs to its pull request
        id: pr
        if: hashFiles('report/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(cat report/pr-number)"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in the report: $pr"
            exit 1
          fi
          # The artifact comes from pull request code, so only trust its PR number if that PR's head is
          # the commit the CI run tested. This keeps one PR from commenting on another.
          pr_head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::warning::PR #$pr is now at $pr_head, not the tested $HEAD_SHA; not commenting."
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: instruction-counts
          number_force: ${{ steps.pr.outputs.number }}
          path: report/summary.md
