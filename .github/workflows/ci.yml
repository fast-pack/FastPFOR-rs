name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test ${{ matrix.os }} (${{ matrix.simd_mode }})
    permissions: { contents: read }
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        simd_mode: [portable, native]
    env:
      FASTPFOR_SIMD_MODE: ${{ matrix.simd_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v0-${{ matrix.simd_mode }}"
      - uses: dtolnay/rust-toolchain@@stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just,cargo-binstall' }
      - run: just ci-test

  test-nightly:
    name: Nightly-specific tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just' }
      - run: rustup install nightly --profile minimal
      - run: just test-publish

  test-msrv:
    name: Test MSRV
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just' }
      - name: Read MSRV
        id: msrv
        run: echo "value=$(just get-msrv)" >> $GITHUB_OUTPUT
      - name: Install MSRV Rust ${{ steps.msrv.outputs.value }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      - run: just ci-test-msrv

  fuzz:
    name: Fuzz ${{ matrix.fuzz_target }} (${{ matrix.platform.target }})
    permissions: { contents: read }
    runs-on: ${{ matrix.platform.runner }}
    # The number of seconds to run the fuzz target.
    env: { FUZZ_TIME: 60 }
    strategy:
      fail-fast: false
      matrix:
        fuzz_target:
          - cpp_roundtrip
          - encode_oracle
          - decode_oracle
          - decode_arbitrary
          - fastpfor_u64
          - compare_fastpfor_128
          - encode_compare
          - simd_compat
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      # Install the nightly Rust channel.
      - run: rustup toolchain install nightly
      - run: rustup default nightly
      # Install and cache `cargo-fuzz`.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'cargo-fuzz@0.13.2' }
      # Build and then run the fuzz target.
      #  An explicit --target is necessary to not default to musl, which is not supported by cargo-fuzz.
      - run: cargo fuzz build --target ${{ matrix.platform.target }} ${{ matrix.fuzz_target }}
      - run: cargo fuzz run --target ${{ matrix.platform.target }} ${{ matrix.fuzz_target }} -- -max_total_time=${{ env.FUZZ_TIME }}
      # Upload fuzzing artifacts on failure for post-mortem debugging.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzzing-artifacts-${{ matrix.fuzz_target }}-${{ matrix.platform.target }}-${{ github.sha }}
          path: fuzz/artifacts

  coverage:
    name: Code Coverage
    permissions: { contents: read }
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: dtolnay/rust-toolchain@@stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just,cargo-llvm-cov' }
      - run: just ci-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  cpd:
    name: Copy/Paste Detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Fetch base branch to detect newly added clones
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just,cargo-binstall' }
      - run: just ci-cpd "origin/$BASE_REF"
        env:
          CPD_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}
      # Posted as a PR comment by `pr-comments.yml`: this job has a read-only token (always so for forks).
      - name: Save the PR number for the comment workflow
        run: echo "$PR_NUMBER" > target/jscpd/pr-number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jscpd
          path: |
            target/jscpd/summary.md
            target/jscpd/pr-number
          retention-days: 7

  bench:
    name: Instruction counts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: recursive }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v0-bench"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: 'just' }
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # Best effort: the hosted runners are VMs, which may not expose the CPU's hardware counters.
      # Without them `just ci-bench` reports only the valgrind counts.
      - name: Let perf read the CPU counters
        continue-on-error: true
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl kernel.perf_event_paranoid=2
      - name: Fetch the base commit to compare with
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: just ci-bench target/bench/summary.md "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Posted as a PR comment by `pr-comments.yml`: this job has a read-only token (always so for forks).
      - name: Save the PR number for the comment workflow
        run: echo "$PR_NUMBER" > target/bench/pr-number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instruction-counts
          path: |
            target/bench/summary.md
            target/bench/pr-number
          retention-days: 7

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    permissions: {}
    needs: [ test, test-nightly, test-msrv, fuzz ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

