[package]
name = "fastpfor"
version = "0.9.1"
description = "FastPFOR lib with C++ Rust wrapper and pure Rust implementation"
authors = [
    "Francisco Jimenez <jjcfrank@gmail.com>",
    "Yuri Astrakhan <YuriAstrakhan@gmail.com>",
]
repository = "https://github.com/jjcfrancisco/fastpfor"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["fastpfor", "compression"]
categories = ["compression"]
rust-version = "1.87"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "fastpfor_benchmark"
required-features = ["rust"]
harness = false

[[bench]]
name = "instructions"
required-features = ["rust"]
harness = false

[features]
default = ["rust", "simd"]
# Used internally for testing and benchmarking. Not intended for public use.
_all_compatible = ["cpp_portable", "rust", "simd"]
# Use portable C++ code that will not rely on the latest CPU features. This is the default for the C++ bindings.
cpp_portable = ["cpp"]
# Optimize FastPFOR for the current CPU.
cpp_native = ["cpp"]
cpp = ["dep:cmake", "dep:cxx", "dep:cxx-build"]
rust = ["dep:bytes", "dep:num-traits"]
# SIMD kernels used by the default `Auto` kernels: AVX2 and SSE2 on x86_64, NEON on aarch64. Without it, `Auto` uses the
# portable code, and with `cpp` also off this crate contains no `unsafe` code (enforced by `forbid(unsafe_code)`).
simd = ["rust", "dep:wide"]
__testing = ["rust"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["min_const_generics"] }
bytes = { version = "1.11", optional = true }
cxx = { version = "1.0.194", optional = true }
num-traits = { version = "0.2", optional = true }
thiserror = "2.0.18"

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
wide = { version = "1.7.1", optional = true, default-features = false }

[build-dependencies]
cmake = { version = "0.1.57", optional = true }
cxx-build = { version = "1.0.194", optional = true }

[dev-dependencies]
criterion = "0.8"
rand = "0.10.0"

[lints.rust]
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
# Restrictions
disallowed_methods = "forbid"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
use_self = "warn"

# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Relax these for now
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unreadable_literal = "allow"
